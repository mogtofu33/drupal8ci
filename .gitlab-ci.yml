workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        DO_RELEASE: "1"
    - when: always

variables:
  BUILD_DIR: './drupal'
  # Docker variables.
  DOCKER_HOST: tcp://docker:2375
  RELEASE_REGISTRY: docker.io
  RELEASE_IMAGE: index.docker.io/$RELEASE_USER
  # Enable buildkit to use '--from-cache' when 'docker build'.
  DOCKER_BUILDKIT: 1
  DO_RELEASE:
    value: "0"
    description: Publish the image to docker, set 0 to not publish.
  RUN_PREVIOUS:
    value: "1"
    description: Run the previous job, set 0 to skip.
  RUN_CURRENT:
    value: "1"
    description: Run the current job, set 0 to skip.
  RUN_NEXT:
    value: "0"
    description: Run the next job, set 0 to skip.
  RUN_CHROME_HEADLESS:
    value: "1"
    description: Run the chrome-headless job, set 0 to skip.

stages:
  - prepare
  - build

.build_template:
  image: docker:29
  stage: build
  services:
    - docker:29-dind
  needs:
    - env
  before_script:
    - docker --version
    # Pull base image from Docker hub.
    - docker pull --quiet $IMAGE_BASE || true
    # Login to Gitlab and pull current image if exist.
    - echo "$CI_JOB_TOKEN" | docker login registry.gitlab.com --username gitlab-ci-token --password-stdin
    - docker pull --quiet $CI_REGISTRY_IMAGE/$IMAGE || true
  script:
    - echo "Build $IMAGE_VERSION with Drupal:$IMAGE_TAG PHP:$PHP_VERSION Node:$NODE_VERSION"
    - apk add --no-cache envsubst
    - if [[ -n "$PHP_VERSION" ]]; then PHP_VERSION="$PHP_VERSION" envsubst < "./drupal/tests/test_php.py.tpl" > "./drupal/tests/test_php.py"; fi
    - if [[ -n "$NODE_VERSION" ]]; then NODE_VERSION="$NODE_VERSION" envsubst < "./drupal/tests/test_packages.py.tpl" > "./drupal/tests/test_packages.py"; fi
    - if [[ -n "$IMAGE_TAG" ]]; then DRUPAL_VERSION="$IMAGE_TAG" envsubst < "./drupal/tests/test_drush.py.tpl" > "./drupal/tests/test_drush.py"; fi
    - echo -e "section_start:$(date +%s):docker_build[collapsed=true]\r\e[0KBuilding $IMAGE"
    - docker build --tag $CI_REGISTRY_IMAGE/$IMAGE --tag $RELEASE_IMAGE/$IMAGE --build-arg IMAGE_VERSION=$IMAGE_VERSION --build-arg IMAGE_TAG=$IMAGE_TAG --build-arg PHP_VERSION=$PHP_VERSION --build-arg NODE_VERSION=$NODE_VERSION $BUILD_DIR
    - echo -e "section_end:$(date +%s):docker_build\r\e[0K"
    - docker push --quiet $CI_REGISTRY_IMAGE/$IMAGE
    - if [[ -d $BUILD_DIR/tests ]]; then ./.gitlab-ci/run-tests.sh $CI_REGISTRY_IMAGE/$IMAGE; fi;
    # Login to Docker hub and push.
    - if [[ "$DO_RELEASE" == "1" ]]; then echo "$RELEASE_PASSWORD" | docker login $RELEASE_REGISTRY --username $RELEASE_USER --password-stdin && docker push --quiet $RELEASE_IMAGE/$IMAGE; fi
  artifacts:
    reports:
      junit: junit.xml

env:
  stage: prepare
  image: alpine:latest
  script:
    - echo "Set env variables from dotenv."
  artifacts:
    reports:
      dotenv: VERSION.env

previous:
  extends: .build_template
  rules:
    - if: '$RUN_PREVIOUS == "1"'
  variables:
    IMAGE_BASE: drupal:${IMAGE_TAG}-php${PHP_VERSION}
    IMAGE: drupal-ci:${CI_COMMIT_REF_NAME}-${IMAGE_TAG}
    IMAGE_TAG: $DRUPAL_PREVIOUS
    PHP_VERSION: $DRUPAL_PREVIOUS_PHP

current:
  extends: .build_template
  rules:
    - if: '$RUN_CURRENT == "1"'
  variables:
    IMAGE_BASE: drupal:${IMAGE_TAG}-php${PHP_VERSION}
    IMAGE: drupal-ci:${CI_COMMIT_REF_NAME}-${IMAGE_TAG}
    IMAGE_TAG: $DRUPAL_CURRENT
    PHP_VERSION: $DRUPAL_CURRENT_PHP

# Enabled only when next version is stable
next:
  extends: .build_template
  rules:
    - if: '$RUN_NEXT == "1"'
  variables:
    IMAGE_BASE: drupal:${IMAGE_TAG}-php${PHP_VERSION}
    IMAGE: drupal-ci:${CI_COMMIT_REF_NAME}-${IMAGE_TAG}
    IMAGE_TAG: $DRUPAL_NEXT
    PHP_VERSION: $DRUPAL_NEXT_PHP

chrome-headless:
  extends: .build_template
  rules:
    - if: '$RUN_CHROME_HEADLESS == "1"'
  variables:
    IMAGE_BASE: debian:bullseye-slim
    IMAGE: chrome-headless:${CI_COMMIT_REF_NAME}
    BUILD_DIR: chrome-headless
    IMAGE_TAG: ''
    PHP_VERSION: ''
    NODE_VERSION: ''
